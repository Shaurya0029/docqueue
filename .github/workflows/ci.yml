name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Postgres and Redis use the same host ports as docker-compose.yml, so the
# test configs (backend/vitest.config.ts, e2e/playwright.config.ts) work
# unchanged locally and in CI.
env:
  JWT_SECRET: ci-jwt-secret
  JWT_REFRESH_SECRET: ci-refresh-secret
  DATABASE_URL: postgresql://docqueue:docqueue@localhost:5433/docqueue
  REDIS_URL: redis://localhost:6380

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: docqueue
          POSTGRES_PASSWORD: docqueue
          POSTGRES_DB: docqueue
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U docqueue" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - name: Create and migrate the test database
        run: |
          PGPASSWORD=docqueue psql -h localhost -p 5433 -U docqueue -d docqueue -c "CREATE DATABASE docqueue_test"
          DATABASE_URL=postgresql://docqueue:docqueue@localhost:5433/docqueue_test npx prisma migrate deploy
      - run: npm test

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run i18n:check # every patient-facing string has Hindi
      - run: npm run build # tsc -b (typecheck) + vite build

  e2e:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: docqueue
          POSTGRES_PASSWORD: docqueue
          POSTGRES_DB: docqueue
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U docqueue" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npx prisma generate
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Phase 0 core journey
        run: npx playwright test
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
